name: Publish Docker Image

on:
  workflow_run:
    workflows:
      - "Jest Unit Tests"
      - "Playwright E2E Tests"
    types:
      - completed

jobs:
  publish_image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # To Create PAT_GITHUB_TOKEN: GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)
          password: ${{ secrets.PAT_GITHUB_TOKEN }}

      - name: Build docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            -t ghcr.io/${{ github.repository_owner }}/popcolab-app:latest \
            -t ghcr.io/${{ github.repository_owner }}/popcolab-app:${{ github.sha }} \
            .

      - name: Push docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/popcolab-app:latest
          docker push ghcr.io/${{ github.repository_owner }}/popcolab-app:${{ github.sha }}
